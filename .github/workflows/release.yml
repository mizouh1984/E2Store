
name: Auto Build IPK

on:
  push:
    branches:
      - main
    paths:
      - 'version.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: ver
        run: echo "v=$(tr -d ' \r\n' < version.txt)" >> $GITHUB_OUTPUT

      - name: Build IPK
        run: |
          VER="${{ steps.ver.outputs.v }}"
          PKG="enigma2-plugin-extensions-mizou1984store_${VER}_all.ipk"
          mkdir -p build/CONTROL build/usr/lib/enigma2/python/Plugins/Extensions/Mizou1984Store
          rsync -av --exclude='.git*' --exclude='build' --exclude='*.md' --exclude='*.html' --exclude='*.sh' --exclude='version.txt' ./ build/usr/lib/enigma2/python/Plugins/Extensions/Mizou1984Store/
          printf "Package: enigma2-plugin-extensions-mizou1984store\nVersion: %s\nDescription: Mizou1984 Store Panel\nSection: extra\nPriority: optional\nMaintainer: mizouh1984\nArchitecture: all\n" "$VER" > build/CONTROL/control
          echo "2.0" > build/debian-binary
          tar -czf build/control.tar.gz -C build/CONTROL .
          tar -czf build/data.tar.gz -C build usr
          ar -r "$PKG" build/debian-binary build/control.tar.gz build/data.tar.gz
          echo "pkg=$PKG" >> $GITHUB_ENV

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: mizou1984-store ${{ steps.ver.outputs.v }}
          files: ${{ env.pkg }}
